<div class="eqLogic eqLogic-widget allowResize #custom_layout# #eqLogic_class#" data-eqType="#eqType#" data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#" data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" style="width:#width#;height:#height#;#style#">
	<style>
		.emw-#uid# { background:#14202b; color:#cfe3ee; border-radius:8px; padding:8px; font-family:inherit; min-width:340px }
		.emw-#uid# svg { width:100%; height:auto; display:block }
		.emw-#uid# .node rect { fill:#1b2a38; stroke:#3b556b; stroke-width:2; rx:8 }
		.emw-#uid# .node text { fill:#e8f3fa; font-size:15px; text-anchor:middle }
		.emw-#uid# .node .lbl { fill:#8fb0c4; font-size:11px }
		.emw-#uid# .pv rect { stroke:#f5a623 } .emw-#uid# .pv text.val { fill:#f5a623 }
		.emw-#uid# .grid rect { stroke:#4a90d9 } .emw-#uid# .grid text.val { fill:#4a90d9 }
		.emw-#uid# .bat rect { stroke:#3ecf63 } .emw-#uid# .bat text.val { fill:#3ecf63 }
		.emw-#uid# .house rect { stroke:#4ec9b0 } .emw-#uid# .house text.val { fill:#4ec9b0 }
		.emw-#uid# .wire { fill:none; stroke:#3b556b; stroke-width:3 }
		.emw-#uid# .flow { fill:none; stroke-width:4; stroke-dasharray:6 10; opacity:0; }
		.emw-#uid# .flow.on { opacity:1; animation:emflow-#uid# 1s linear infinite }
		.emw-#uid# .flow.rev { animation-direction:reverse }
		@keyframes emflow-#uid# { to { stroke-dashoffset:-16 } }
		.emw-#uid# .cons { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px }
		.emw-#uid# .tile { flex:1 1 90px; background:#1b2a38; border:2px solid #3b556b; border-radius:8px; padding:4px 6px; text-align:center; font-size:12px }
		.emw-#uid# .tile.on { border-color:#4ec9b0 }
		.emw-#uid# .tile b { display:block; font-size:15px }
		.emw-#uid# .ctl { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; font-size:12px }
		.emw-#uid# .ctl .btn { padding:2px 8px }
		.emw-#uid# .ctl .btn.active { background:#4ec9b0; color:#0b1620; border-color:#4ec9b0 }
		.emw-#uid# .dec { margin-top:6px; font-size:11px; color:#8fb0c4 }
		.emw-#uid# .led { display:inline-block; width:16px; height:16px; border-radius:50%; cursor:pointer; border:2px solid #0b1620; vertical-align:middle }
		.emw-#uid# .led.g { background:#3ecf63; box-shadow:0 0 6px #3ecf63 }
		.emw-#uid# .led.r { background:#d9534f; box-shadow:0 0 6px #d9534f }
		.emw-#uid# .tile.unpiloted { opacity:.55; border-style:dashed }
		.emw-#uid# .tile .led { width:12px; height:12px; float:right }
		.emw-#uid# .master { font-size:13px; margin-bottom:4px }
		.emw-#uid# .sim { display:none; background:#d9534f; color:#fff; border-radius:4px; padding:1px 8px; font-size:11px; margin-left:6px }
	</style>
	<center class="widget-name">
		<a href="#eqLink#" class="reportModeHidden">#name_display# <span class="object_name">#object_name#</span></a>
		<span class="sim" id="sim-#uid#">SIMULATION</span>
	</center>
	<div class="emw-#uid#">
		<div class="master"><span class="led r" id="led-#uid#" title="Pilotage par energyManager : cliquer pour activer / désactiver"></span> <span id="ledtxt-#uid#"></span></div>
		<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg">
			<!-- fils -->
			<path class="wire" d="M120 45 H280 V105"/>
			<path class="wire" d="M120 125 H210"/>
			<path class="wire" d="M280 145 V195 H210"/>
			<path class="wire" d="M350 125 H440"/>
			<!-- flux animés -->
			<path class="flow" id="fpv-#uid#" stroke="#f5a623" d="M120 45 H280 V105"/>
			<path class="flow" id="fgrid-#uid#" stroke="#4a90d9" d="M120 125 H210"/>
			<path class="flow" id="fbat-#uid#" stroke="#3ecf63" d="M280 145 V195 H210"/>
			<path class="flow" id="fhouse-#uid#" stroke="#4ec9b0" d="M350 125 H440"/>
			<!-- noeuds -->
			<g class="node pv" transform="translate(10,15)"><rect width="110" height="60"/><text class="lbl" x="55" y="18">☀ SOLAIRE</text><text class="val" id="pv-#uid#" x="55" y="45">-- W</text></g>
			<g class="node grid" transform="translate(10,95)"><rect width="110" height="60"/><text class="lbl" x="55" y="18">⚡ RÉSEAU EDF</text><text class="val" id="grid-#uid#" x="55" y="45">-- W</text></g>
			<g class="node" transform="translate(210,105)"><rect width="140" height="40"/><text class="lbl" x="70" y="16">MULTIPLUS II</text><text id="inj-#uid#" x="70" y="33" style="font-size:12px">injection 0 W</text></g>
			<g class="node house" transform="translate(440,95)"><rect width="110" height="60"/><text class="lbl" x="55" y="18">🏠 MAISON</text><text class="val" id="house-#uid#" x="55" y="45">-- W</text></g>
			<g class="node bat" transform="translate(10,175)"><rect width="200" height="60"/><text class="lbl" x="100" y="18">🔋 BATTERIE 16 kWh</text><text class="val" id="bat-#uid#" x="100" y="45">-- % · -- W</text></g>
			<g class="node" transform="translate(300,175)"><rect width="250" height="60"/><text class="lbl" x="125" y="18">LIMITES</text><text id="lim-#uid#" x="125" y="45" style="font-size:13px">Hoymiles -- · charge --</text></g>
		</svg>
		<div class="cons" id="cons-#uid#"></div>
		<div class="ctl">
			<span>Priorité :</span>
			<a class="btn btn-xs btn-default" id="bpt-#uid#">Tesla</a>
			<a class="btn btn-xs btn-default" id="bpb-#uid#">Batterie</a>
			<span>Cible :</span>
			<a class="btn btn-xs btn-default" id="b95-#uid#">95 %</a>
			<a class="btn btn-xs btn-default" id="b100-#uid#">100 %</a>
			<span title="SOC que la batterie doit encore avoir au soir, quand la production passe sous le talon">Réserve nuit :</span>
			<input type="range" min="0" max="100" step="5" id="rsv-#uid#" style="width:110px"/> <b id="rsvv-#uid#"></b>
			<span>Simulation :</span>
			<a class="btn btn-xs btn-default" id="bson-#uid#">ON</a>
			<a class="btn btn-xs btn-default" id="bsoff-#uid#">OFF</a>
		</div>
		<div class="dec" id="dec-#uid#"></div>
	</div>
	<script>
		(function () {
			var uid = '#uid#'
			var V = { pv: '#pv_val#', grid: '#grid_val#', batt: '#batt_val#', soc: '#soc_val#', house: '#house_val#', inj: '#injection_val#',
				hoy: '#hoy_limit_val#', chg: '#charge_limit_val#', dec: '#decision_val#', sim: '#sim_info_val#', prio: '#tesla_priority_info_val#', tgt: '#batt_target_info_val#', act: '#active_info_val#', rsv: '#reserve_info_val#' }
			var consumers = #consumers#
			var el = function (id) { return document.getElementById(id + '-' + uid) }
			var num = function (v) { var n = parseFloat(v); return isNaN(n) ? 0 : n }
			var fmt = function (v) { return Math.round(num(v)) + ' W' }
			var setFlow = function (id, value, reverseWhenPositive) {
				var f = el(id), on = Math.abs(num(value)) > 10
				f.setAttribute('class', 'flow' + (on ? ' on' : '') + ((on && ((num(value) > 0) === reverseWhenPositive)) ? ' rev' : ''))
			}
			var mark = function (id, active) { var b = el(id); if (b) { b.className = 'btn btn-xs btn-default' + (active ? ' active' : '') } }
			function render() {
				el('pv').textContent = fmt(V.pv)
				el('grid').textContent = (num(V.grid) < 0 ? 'injection ' : 'soutirage ') + fmt(Math.abs(num(V.grid)))
				el('house').textContent = fmt(V.house)
				el('bat').textContent = Math.round(num(V.soc)) + ' % · ' + fmt(V.batt)
				el('inj').textContent = 'injection ' + fmt(V.inj)
				el('lim').textContent = 'Hoymiles ' + fmt(V.hoy) + ' · charge ' + fmt(V.chg)
				el('dec').textContent = V.dec
				setFlow('fpv', V.pv, false)
				setFlow('fgrid', V.grid, false)     // soutirage (positif) : du réseau vers la maison ; injection : sens inverse
				setFlow('fbat', V.batt, false)      // charge : du centre vers la batterie
				setFlow('fhouse', V.house, false)
				document.getElementById('sim-' + uid).style.display = (String(V.sim) === '1') ? 'inline-block' : 'none'
				mark('bpt', V.prio === 'tesla'); mark('bpb', V.prio === 'battery')
				mark('b95', String(V.tgt) === '95'); mark('b100', String(V.tgt) === '100')
				mark('bson', String(V.sim) === '1'); mark('bsoff', String(V.sim) !== '1')
				var rs = el('rsv'); if (document.activeElement !== rs) { rs.value = num(V.rsv) }
				el('rsvv').textContent = Math.round(num(V.rsv)) + ' %'
				var activeOn = (String(V.act) !== '0')
				el('led').className = 'led ' + (activeOn ? 'g' : 'r')
				el('ledtxt').textContent = activeOn ? 'Pilotage actif' : 'Pilotage désactivé : rien n\'est commandé'
				var html = ''
				consumers.forEach(function (c, i) {
					html += '<div class="tile ' + (c.status === 'ON' ? 'on' : '') + (c.piloted ? '' : ' unpiloted') + '">'
						+ '<span class="led ' + (c.piloted ? 'g' : 'r') + '" data-i="' + i + '" title="Piloté par energyManager : cliquer pour changer"></span>'
						+ c.name + '<b>' + Math.round(c.power) + ' W</b>' + c.status + '</div>'
				})
				document.getElementById('cons-' + uid).innerHTML = html
			}
			function bind(cmdId, key) {
				jeedom.cmd.update[cmdId] = function (_options) { V[key] = _options.display_value; render() }
			}
			bind('#pv_id#', 'pv'); bind('#grid_id#', 'grid'); bind('#batt_id#', 'batt'); bind('#soc_id#', 'soc')
			bind('#house_id#', 'house'); bind('#injection_id#', 'inj'); bind('#hoy_limit_id#', 'hoy'); bind('#charge_limit_id#', 'chg')
			bind('#active_info_id#', 'act'); bind('#reserve_info_id#', 'rsv'); bind('#decision_id#', 'dec'); bind('#sim_info_id#', 'sim'); bind('#tesla_priority_info_id#', 'prio'); bind('#batt_target_info_id#', 'tgt')
			consumers.forEach(function (c, i) {
				if (c.power_id) { jeedom.cmd.update[c.power_id] = function (o) { consumers[i].power = num(o.display_value); render() } }
				if (c.piloted_id) { jeedom.cmd.update[c.piloted_id] = function (o) { consumers[i].piloted = (String(o.display_value) !== '0') ? 1 : 0; render() } }
				if (c.status_id) { jeedom.cmd.update[c.status_id] = function (o) { consumers[i].status = o.display_value; render() } }
			})
			var act = function (id, cmdId) { el(id).onclick = function () { jeedom.cmd.execute({ id: cmdId }) } }
			act('bpt', '#prio_tesla_id#'); act('bpb', '#prio_battery_id#'); act('b95', '#target_95_id#'); act('b100', '#target_100_id#')
			act('bson', '#sim_on_id#'); act('bsoff', '#sim_off_id#')
			el('rsv').onchange = function () { V.rsv = this.value; render(); jeedom.cmd.execute({ id: '#reserve_set_id#', value: { slider: this.value } }) }
			el('led').onclick = function () { jeedom.cmd.execute({ id: (String(V.act) !== '0') ? '#active_off_id#' : '#active_on_id#' }) }
			document.getElementById('cons-' + uid).onclick = function (ev) {
				var t = ev.target
				if (!t || !t.getAttribute || t.getAttribute('data-i') === null) { return }
				var c = consumers[parseInt(t.getAttribute('data-i'), 10)]
				jeedom.cmd.execute({ id: c.piloted ? c.pilot_off_id : c.pilot_on_id })
			}
			render()
		})()
	</script>
</div>
